# The iron-condor strategy: short iron condors on the account's allowed
# underlyings (limits.env, LIMIT_UNDERLYINGS). Run by the agent in
# catalyst/options-iron-condor.yaml, which reads this file through
# get_strategy at the start of every run; the file name is the strategy's id.
#
# The numbers are hard limits on this strategy's own orders that open risk,
# which the adapter enforces inside the account's (limits.env). The rules are
# what the agent is asked to do, and hold only as far as the numbers do.
#
# Mounted from a ConfigMap whose name does not change, so an edit reaches the
# adapter a minute or two after Argo CD syncs it, without restarting the pod.

description = "Iron condors, about 38 days out, $5 wings, short strikes near 0.16 delta, for $0.50 or more"

# EUR: the worst loss of its open positions and working opening orders.
budget_eur = 2500
max_loss_per_order_eur = 500
# Per UTC day, counting refused and cancelled ones.
max_opening_orders_per_day = 6
min_days_to_expiry = 30
max_days_to_expiry = 45
# Every opening order is two puts and two calls.
rights = ["C", "P"]
legs = 4
# Per share: an opening order's limit_price must be -0.50 or lower. $5 wings
# at 0.16 delta bring in less than a put spread nearer the money; the worst
# loss is one wing's width less the credit, about $450.
min_credit = 0.50
# true: it opens nothing, and closes still go through.
kill_switch = false

rules = '''
You sell iron condors: sell a put and buy the put $5 below it, sell a call
and buy the call $5 above it, all four at one expiry, one contract, as one
order, for a credit. Prices are per share. A leg's mid is (bid + ask) / 2
from quotes you took in this run.

Manage what you hold first, then open.

MANAGING. A short put, a long put, a short call and a long call of the same
underlying and expiry in get_positions are one condor. For each condor:
1. Credit received: the two short legs' avg_price minus the two long legs'
   avg_price.
2. Cost to close: the two short legs' mids minus the two long legs' mids.
3. Close it if any of these holds:
   - the cost to close is at most half the credit received (take the profit);
   - the cost to close is at least three times the credit received (the loss
     has reached twice the credit);
   - 21 days or fewer are left to its expiry.
4. To close: one order with all four legs the other way round (buy the
   shorts, sell the longs), quantity as held, limit_price the cost to close
   rounded up to the cent, never below 0.01, positive (you pay). Always close
   all four legs together.
5. If a closing order of yours for it is still working from an earlier run,
   cancel it first, then place the new one under a new id.

OPENING. For each allowed underlying that get_status lists:
1. Expiry: from get_option_chain, the expiration closest to 38 days away
   within your min_days_to_expiry and max_days_to_expiry. If you already hold
   a condor at that expiry on this underlying, go to the next underlying.
2. Quote the underlying for its price; a stock or ETF quote has no delta,
   which is normal. Build the symbols for the puts at every listed strike
   from about 4% to 12% below its price and the calls from about 2% to 8%
   above it, at most 50 in all, and quote them. If those option quotes carry
   no delta, open nothing and report it.
3. Short put: the put whose delta is closest to -0.16, which must lie between
   -0.12 and -0.20; long put: the put $5 below it. Short call: the call whose
   delta is closest to 0.16, which must lie between 0.12 and 0.20; long call:
   the call $5 above it. All four need a bid and an ask; if not, go to the
   next underlying.
4. Credit: the two short legs' mids minus the two long legs' mids. Under
   your min_credit (get_strategy), go to the next underlying.
5. limit_price: minus the credit, rounded toward zero to the cent: a credit
   of 0.617 gives -0.61. Never ask for less credit than the mids give.
6. If an opening order of yours on this underlying is still working from an
   earlier run: when it is for the same four options and its limit_price is
   within 0.05 of the new one, leave it and go to the next underlying;
   otherwise cancel it and go on.
7. preview_order, quantity 1. If it is refused because another strategy
   holds or has an order working on one of the options, move that side's two
   strikes $1 further from the underlying's price and preview once more. If
   it is refused for any other reason, or again, report why and go to the
   next underlying. Otherwise place_order with the same arguments.
'''
