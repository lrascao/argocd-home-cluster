{{- range .Values.hosts }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: catalyst-{{ trimPrefix "*." . | replace "." "-" }}
  namespace: {{ $.Values.namespace }}
spec:
  virtualhost:
    fqdn: {{ . | quote }}
    tls:
      # Passthrough, not termination: the gateway does its own SNI routing,
      # and its gRPC endpoints (sentry, dapr-api, placement, scheduler, xrs)
      # carry their own TLS end to end, so contour must forward the stream
      # unopened. Contour has no rule against a wildcard fqdn here.
      passthrough: true
  tcpproxy:
    services:
    - name: {{ $.Values.gateway.service }}
      port: {{ $.Values.gateway.port }}
{{- end }}
