# Top level, not under catalyst:, because helm only hands a subchart the
# parent's own global block.
global:
  # Managed pub/sub on the Kafka in namespace kafka (bitnami chart, installed
  # by hand). The agent writes these into each project's Dapr Kafka component,
  # hence Dapr's vocabulary: sasl_mechanism PLAINTEXT is Dapr's name for
  # SASL/PLAIN, not the Kafka security protocol.
  #
  # The broker's CLIENT listener is SASL_PLAINTEXT, so the agent refuses to
  # start without a password ("SASLPassword is required"). user1's password
  # (kafka/kafka-user-passwords, client-passwords) is sealed into
  # catalyst-kafka and reaches the agent as an environment variable -- see
  # catalyst.agent.extraEnvs.
  kafka:
    disabled: false
    create: false
    external:
      enabled: true
      brokers: kafka.kafka.svc.cluster.local:9092
      auth_type: password
      sasl_username: user1
      # Empty on purpose, see catalyst.agent.extraEnvs.
      sasl_password: ""
      sasl_mechanism: PLAINTEXT
      disable_tls: true
      # lets app sidecars reach the Kafka pod through Catalyst's network policies
      namespace: kafka
      pod_selector_match_labels:
        - name: app.kubernetes.io/instance
          value: kafka

catalyst:
  # No join_token here: this repo is public. The agent reads it from the
  # sealed catalyst-join-token secret (charts/local/templates/), which also
  # means the chart no longer copies it into the agent-config ConfigMap. The
  # token expires 2026-11-11; re-sealing it is in README.md.
  agent:
    existingJoinTokenSecret:
      name: catalyst-join-token
      key: join_token
    # external_kafka has no secret reference in the chart, but the agent
    # resolves any config key from CRA_ + its upper-cased path, and the
    # environment wins over the config file. Tested 2026-11-04 with a
    # throwaway agent: the CRA_-prefixed name passes validation, the bare
    # PROJECT_EXTERNAL_KAFKA_SASL_PASSWORD does not.
    extraEnvs:
    - name: CRA_PROJECT_EXTERNAL_KAFKA_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: catalyst-kafka
          key: sasl_password
    config:
      host:
        ingress:
          # The ingress VIP. Without it the agent waits forever for a
          # LoadBalancer address this cluster has nothing to hand out; contour
          # owns :443 there and passes the region's names through to the
          # gateway (local.hosts below).
          ip_addr: 192.168.3.40

      project:
        default_managed_state_store_type: postgresql-shared-external
        external_postgresql:
          enabled: true
          disable_tls: true
          auth_type: connectionString
          namespace: postgresql
          # host, port, username and password come from this secret (sealed in
          # charts/local/templates/) rather than the connection_string_* keys,
          # which would put the password in the agent-config and
          # management-config ConfigMaps. Both the agent and management read
          # it; the chart only emits management's region_postgresql block when
          # it can see either this or an inline password. The old
          # connection_string_database is gone for good: the agent logged it as
          # "not recognized and has no effect", and names its tenant databases
          # (sched, db_region) itself.
          existing_secret_name: catalyst-postgres
          existing_secret_namespace: cra-agent

      internal_dapr:
        # Root Sentry issues from our PKI (charts/local/templates/dapr-pki.yaml)
        # rather than the CA it generated at install. Both halves are required
        # together. The issuer Secret is re-read every minute, so cert-manager's
        # renewals land on their own; the anchors are read only at boot, and a
        # change to them needs an admin rejoin first. README.md, "Dapr PKI".
        pki:
          issuer:
            secret:
              name: catalyst-dapr-issuer
              # Both namespaces are pkiNamespace in charts/local/values.yaml;
              # the PKI stays out of cra-agent.
              namespace: diagrid
          trust:
            config_map:
              name: catalyst-dapr-trust-anchors
              namespace: diagrid
        sentry:
          jwt:
            enabled: true
          oidc:
            enabled: true
            # Validate inbound user JWTs against the IdPFederation cache.
            idp_federation_enabled: true
            # /token only over the in-cluster mTLS listener (sidecar SVID required).
            mtls:
              enabled: true

      # The agent publishes the release Diagrid says this region should install
      # next into ConfigMap catalyst-release-availability in cra-agent. It is a
      # fact, not an action: nothing upgrades the region off it, the bump stays
      # a commit to Chart.yaml, and the ConfigMap is what tells us a new
      # candidate is out without watching the ECR tag list by hand. README.md
      # has the reader side.
      release_availability:
        enabled: true
        # enabled on its own starts nothing: rc.23 logged "not starting release
        # availability publisher: release resolver endpoint is required" and
        # wrote no ConfigMap. The agent calls the resolver over mutual TLS, so
        # the outbound HTTPS must reach it uninspected.
        endpoint: https://catalyst-releases.r1.diagrid.io
        # Seconds between refreshes; 300 is the default. A decision carries an
        # expiresAt about 15 minutes out, so the default refreshes it three
        # times over and whoever reads the ConfigMap still has to check that
        # expiresAt has not passed.
        interval_in_sec: 300
        # The chart turns each reader into a Role and RoleBinding for `get` on
        # that one ConfigMap, and drops the key before writing the agent config
        # (the agent has no such setting). argocd-repo-server is the only ArgoCD
        # component that cannot already read ConfigMaps in cra-agent -- the
        # application controller and argocd-server both can, cluster-wide -- so
        # it is the one that needs naming for whatever reads the answer while
        # rendering this chart.
        readers:
        - name: argocd-repo-server
          namespace: argocd

      sidecar:
        # 1.138.0-rc.23 raised the chart's sidecar requests to 50m/96Mi; these
        # are the 10m/25Mi every sidecar in this region had been scheduled with
        # up to then, pinned here so a chart bump no longer moves them. Ten
        # sidecars in prj-14384718 means the chart's figures would have added
        # about 400m CPU and 710Mi of requests on four nodes already at 30-63%
        # CPU and 30-42% memory requests.
        #
        # Requests only decide scheduling; limits are untouched (helm merges
        # maps key by key, so the chart's 300m/256Mi stay), and a sidecar still
        # bursts up to them. Measured 2026-11-11, the cra container runs 5-7m
        # CPU and 42-65Mi: the CPU request covers that, the memory one asks for
        # well under half of it, which is what the chart's 96Mi was correcting.
        # The scheduler therefore packs a node tighter than reality, and under
        # memory pressure the kubelet evicts whatever is furthest over its
        # request -- these pods -- first.
        resources:
          requests:
            cpu: 10m
            memory: 25Mi

  management:
    config:
      tunnel:
        enabled: true

  gateway:
    envoy:
      service:
        # Reached through contour on the ingress VIP, not an address of its own.
        type: ClusterIP

local:
  namespace: cra-agent

  # Names contour hands to the gateway, one HTTPProxy each; contour matches on
  # the SNI the client sends.
  hosts:
  # The region's managed domain -- ingress-wildcard-domain in ConfigMap
  # region-details. These are the names Catalyst hands out and the only ones
  # the gateway answers for: its SNI chains, its virtual hosts and its
  # certificate (ZeroSSL, *.<this> only) all use them. The house DNS answers
  # them locally with the ingress VIP (db.catalyst in ansible-local-network);
  # Diagrid's public answer, a CNAME to diagrid.home, resolves nowhere.
  - "*.e7tvfqjhulsxxzixrntfpe6mgzyny72w.r1.privatediagrid.net"
  # Reaches the gateway, which then serves the certificate above, so a TLS
  # client refuses it. Kept so a *.diagrid.home name fails at the gateway
  # rather than at contour.
  - "*.diagrid.home"

  gateway:
    service: gateway-envoy
    # The https-listener: the same SNI passthrough chains as 8080, plus a
    # TLS-terminating fallback for the HTTP virtual hosts (management, oidc,
    # trust, tunnels). The control plane pushes it once the agent has
    # registered; 8080's fallback is plain HTTP, so HTTPS sent there fails.
    port: 8443
