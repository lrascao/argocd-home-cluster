catalyst:
  # No join_token here: this repo is public. The agent reads it from the
  # sealed catalyst-join-token secret (charts/local/templates/), which also
  # means the chart no longer copies it into the agent-config ConfigMap. The
  # token expires 2026-11-11; re-sealing it is in README.md.
  agent:
    existingJoinTokenSecret:
      name: catalyst-join-token
      key: join_token
    config:
      host:
        ingress:
          # The ingress VIP. Without it the agent waits forever for a
          # LoadBalancer address this cluster has nothing to hand out; contour
          # owns :443 there and passes the region's names through to the
          # gateway (local.hosts below).
          ip_addr: 192.168.3.40

      project:
        default_managed_state_store_type: postgresql-shared-external
        external_postgresql:
          enabled: true
          disable_tls: true
          auth_type: connectionString
          namespace: postgres
          # host, port, username and password come from this secret (sealed in
          # charts/local/templates/) rather than the connection_string_* keys,
          # which would put the password in the agent-config and
          # management-config ConfigMaps. Both the agent and management read
          # it; the chart only emits management's region_postgresql block when
          # it can see either this or an inline password. The old
          # connection_string_database is gone for good: the agent logged it as
          # "not recognized and has no effect", and names its tenant databases
          # (sched, db_region) itself.
          existing_secret_name: catalyst-postgres
          existing_secret_namespace: cra-agent

      internal_dapr:
        sentry:
          jwt:
            enabled: true
          oidc:
            enabled: true
            # Validate inbound user JWTs against the IdPFederation cache.
            idp_federation_enabled: true
            # /token only over the in-cluster mTLS listener (sidecar SVID required).
            mtls:
              enabled: true

  management:
    config:
      tunnel:
        enabled: true

  gateway:
    envoy:
      service:
        # Reached through contour on the ingress VIP, not an address of its own.
        type: ClusterIP

local:
  namespace: cra-agent

  # Names contour hands to the gateway, one HTTPProxy each; contour matches on
  # the SNI the client sends.
  hosts:
  # The region's managed domain -- ingress-wildcard-domain in ConfigMap
  # region-details. These are the names Catalyst hands out and the only ones
  # the gateway answers for: its SNI chains, its virtual hosts and its
  # certificate (ZeroSSL, *.<this> only) all use them. The house DNS answers
  # them locally with the ingress VIP (db.catalyst in ansible-local-network);
  # Diagrid's public answer, a CNAME to diagrid.home, resolves nowhere.
  - "*.e7tvfqjhulsxxzixrntfpe6mgzyny72w.r1.privatediagrid.net"
  # Reaches the gateway, which then serves the certificate above, so a TLS
  # client refuses it. Kept so a *.diagrid.home name fails at the gateway
  # rather than at contour.
  - "*.diagrid.home"

  gateway:
    service: gateway-envoy
    # The https-listener: the same SNI passthrough chains as 8080, plus a
    # TLS-terminating fallback for the HTTP virtual hosts (management, oidc,
    # trust, tunnels). The control plane pushes it once the agent has
    # registered; 8080's fallback is plain HTTP, so HTTPS sent there fails.
    port: 8443
