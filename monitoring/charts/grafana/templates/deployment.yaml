apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana 
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.4.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_INSTALL_PLUGINS
          value: "vonage-status-panel,grafana-piechart-panel"
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        # Read at startup by the file provider. Deliberately NOT on the PVC:
        # these dashboards come from git, and putting them on the volume would
        # give them a second copy that drifts.
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards-provisioned
      restartPolicy: Always
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-grafana
      - name: dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      # projected rather than a plain configMap, because a configMap volume
      # takes exactly one ConfigMap and the second dashboard had nowhere to
      # go. Projecting merges them into one directory, so dashboard N+1 is a
      # new ConfigMap plus one line here rather than another volume and
      # another mountPath.
      - name: dashboards
        projected:
          sources:
          - configMap:
              name: grafana-dashboard-vllm
          - configMap:
              name: grafana-dashboard-heatpump
          - configMap:
              name: grafana-dashboard-voice
