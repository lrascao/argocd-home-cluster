home-assistant:
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: ""

  ingress:
    enabled: true
    className: contour
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      ingress.kubernetes.io/force-ssl-redirect: "true"
      kubernetes.io/tls-acme: "true"
    hosts:
      - host: home-assistant.88288338.xyz
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: certs-ingress
        hosts:
          - home-assistant.88288338.xyz

  configuration:
    enabled: true
    forceInit: true
    trusted_proxies:
      - 10.0.0.0/8
