apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: default
  namespace: home-assistant
spec:
  virtualhost:
    fqdn: home-assistant.88288338.xyz
    tls:
      # The wildcard published by acme-cert-sync, reachable across namespaces
      # through its TLSCertificateDelegation. Contour reads the secret itself,
      # so no copy is needed here.
      secretName: acme/wildcard-88288338-xyz
  routes:
    - services:
        - name: home-assistant
          port: 8080
    - conditions:
      - prefix: /api/websocket
      enableWebsockets: true # Setting this to true enables websocket for all paths that match /websocket
      services:
      - name: home-assistant
        port: 8080

