local:
  namespace: acme

  sync:
    # Directory the coredns acme plugin exports to, on the node itself. Only
    # the instance that currently holds the election has anything in it, so
    # every other pod in the daemonset idles.
    hostPath: /etc/coredns/acme
    # Subdirectory holding the certificate to publish. The plugin writes one
    # per issued name, and "*" is sanitised to "wildcard_".
    certName: wildcard_.88288338.xyz
    # Secret the certificate is published to, in this chart's namespace.
    secretName: wildcard-88288338-xyz
    # How often to look, in seconds. The certificate changes every 60 days;
    # this is really about noticing the election moving to another node.
    period: 60
    # Alpine with kubectl already in it, pinned to the cluster's own minor.
    # This was alpine:latest plus an `apk add kubectl` at start time, which
    # made every restart depend on reaching a package mirror -- the wrong
    # dependency for the pod that publishes the certificate every public name
    # is served with, and the same unpinned-dependency shape that took DNS
    # down in 2026-08. Bump this in step with the cluster.
    image: alpine/kubectl:1.36.2

  delegation:
    # Namespaces allowed to reference the secret from an HTTPProxy. Explicit
    # rather than "*": one wildcard key covers every public name, so the list
    # is the namespaces that actually serve one. Add a namespace here when it
    # starts using the wildcard, not before.
    targetNamespaces:
      - actual-budget
      - registry
