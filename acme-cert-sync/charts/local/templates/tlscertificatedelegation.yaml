apiVersion: projectcontour.io/v1
kind: TLSCertificateDelegation
metadata:
  name: acme-cert-sync
  namespace: {{ .Values.namespace }}
spec:
  # Secrets are namespaced, so without this every route would need its own copy
  # of the wildcard. Delegation lets an HTTPProxy anywhere reference this one by
  # "{{ .Values.namespace }}/{{ .Values.sync.secretName }}".
  delegations:
  - secretName: {{ .Values.sync.secretName }}
    targetNamespaces:
{{- range .Values.delegation.targetNamespaces }}
    - {{ . | quote }}
{{- end }}
