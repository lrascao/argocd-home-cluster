apiVersion: v1
kind: ServiceAccount
metadata:
  name: acme-cert-sync
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acme-cert-sync
  namespace: {{ .Values.namespace }}
rules:
# create cannot be restricted by resourceNames, the name does not exist yet at
# admission time. It is scoped to this namespace, which holds nothing but the
# certificate secret, so the grant covers exactly the object below.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
# Everything after creation is pinned to the one secret.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ .Values.sync.secretName }}"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-cert-sync
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acme-cert-sync
subjects:
- kind: ServiceAccount
  name: acme-cert-sync
  namespace: {{ .Values.namespace }}
