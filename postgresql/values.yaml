postgresql:
  auth:
    database: catalyst
    # The password is NOT set here on purpose. Left unset, the chart falls
    # back to `randAlphaNum 24` in its secrets.yaml, and the `lookup` that
    # would otherwise reuse the live secret returns nothing under `helm
    # template` -- which is how ArgoCD renders. The result would be a new
    # random password written on every sync, against a database that was
    # initialised with the old one.
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password

  global:
    defaultStorageClass: longhorn

  # The image that was running on 2026-11-11, PostgreSQL 18.6. Left alone the
  # chart uses bitnami/postgresql:latest with IfNotPresent, so a restart on a
  # node without it cached pulls whatever latest is that day, and a new major
  # version refuses the data directory. Moving off it is a deliberate change
  # to this digest, with a dump in hand when it is a major.
  image:
    digest: sha256:b418fd5f001c272aad93ac1febf783f543ee45d8e359d58bd5afc3d2a9b62290

  primary:
    networkPolicy:
      # Off because the `home-cluster` AppProject blacklists NetworkPolicy, so
      # ArgoCD would refuse to sync the one this chart renders. Turning it off
      # here keeps that rule intact rather than widening it for every app.
      #
      # The hand install created one, and it is still in the namespace,
      # untracked by anything. It enforces nothing -- flannel is the only CNI
      # here and does not implement NetworkPolicy -- so it is safe to delete:
      #   kubectl delete networkpolicy postgresql -n postgresql
      enabled: false

    # Catalyst's Dapr state store needs logical replication.
    #
    # max_connections is up from the default 100, 3 of them reserved for
    # superusers. At rest there are about 40 (2026-11-11): 21 from the Dapr
    # scheduler, 6 walsenders, 5 on db_region and a handful from the
    # project's stores. A rollout is what runs out. Each Catalyst sidecar
    # pools up to 8 connections for its workflow store and 8 for its actor
    # state, plus 2 each for KV and AI-agent state. When the agent rolls them
    # all, old and new pods hold pools at the same time. On 2026-11-11 that
    # happened while the scheduler rolled too, and the new sidecars
    # crash-looped for three minutes on SQLSTATE 53300 until the old ones let
    # go. 200 leaves room for that overlap to double as app IDs are added.
    #
    # Changing this file's settings restarts the pod: the StatefulSet carries
    # a checksum of them, and max_connections needs a restart anyway.
    extendedConfiguration: |
      wal_level = logical
      max_connections = 200
    persistence:
      # Matches the live volumeClaimTemplate. volumeClaimTemplates are
      # immutable, so changing this means recreating the StatefulSet by hand.
      size: 1Gi
    # The small preset, spelled out, with the memory limit raised from 768Mi
    # to go with max_connections: every backend has memory of its own, and an
    # OOM kill at the peak of a rollout is worse than the refused connections
    # this fixes. The requests are the preset's, so scheduling is unchanged.
    # At rest the container uses about 180Mi.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 1536Mi
        ephemeral-storage: 2Gi
