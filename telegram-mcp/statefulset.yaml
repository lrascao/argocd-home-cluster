apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telegram
  namespace: telegram-mcp
  labels:
    app: telegram
spec:
  # One session, one process. telegram_mcp takes a per-session lock
  # (TELEGRAM_SESSION_LOCK=exclusive by default) and Telegram answers a second
  # client on the same auth key with AuthKeyDuplicatedError, so a second
  # replica would not just be wasteful, it would fight this one.
  replicas: 1
  # StatefulSets have no Recreate. With one replica, RollingUpdate already
  # deletes the old pod and waits for it to be gone before creating the new
  # one, so the session never has two owners.
  serviceName: telegram
  selector:
    matchLabels:
      app: telegram
  # The default, spelled out: the volume holds the logged-in session. Losing it
  # is survivable here (the init container re-derives it from the sealed
  # session string, unlike whatsapp-mcp where it means scanning a QR again),
  # but it also holds Telethon's update cursor and entity cache.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: telegram
    spec:
      # The app reads its config from TELEGRAM_* / MCP_* env vars, and Service
      # links inject <SERVICE>_PORT=tcp://... for every Service in the
      # namespace. Switch them off rather than relying on names not colliding.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Longhorn hands over a bare ext4 volume owned by root; fsGroup is what
        # makes /data writable by the unprivileged uid these containers use.
        fsGroup: 65532
      initContainers:
      # Lay down the source tree and its dependencies on /src, shared with
      # every other container in the pod.
      #
      # This is deliberately NOT `uvx --from "telegram-mcp @ <url>"`, which is
      # how polymarket-mcp installs its server. telegram_mcp ships an install
      # provenance guard (telegram_mcp/install_guard.py): because the
      # `telegram-mcp` name on PyPI belongs to an unrelated project, it refuses
      # to start unless the installer recorded a git or file:// direct URL, or
      # no distribution metadata exists at all. A plain archive install records
      # PEP 610 `archive_info`, which it rejects -- the process exits with
      # "Refusing to start" before reading any config. `uv sync` installs the
      # project editably from this directory, so the recorded URL is
      # file:///src and the guard resolves /src/pyproject.toml and is happy.
      #
      # The guard's other accepted path -- `pip install git+https://...` -- is
      # not open to us: this image has no git (nor curl), which is also why the
      # download below is python's urllib rather than a one-line fetch.
      #
      # --frozen installs exactly what upstream's committed uv.lock pins, so a
      # restart in a year resolves the same tree. That is what replaces
      # polymarket's --exclude-newer date here; there is no date to move.
      - name: source
        image: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie-slim@sha256:6ff812e34a0e14b4b8bc9ddf25e77b3e16bac6e0c4d9b67641f40366fa382d4c
        workingDir: /src
        command:
        - sh
        - -c
        # The tarball is pinned by content, not just by tag: a moved tag, or a
        # GitHub-side change in how it renders archives, fails the hash and the
        # pod stays down rather than quietly running something else. Take the
        # new hash from `sha256sum` of the archive when bumping the tag.
        - |
          set -eu
          url=https://github.com/chigwell/telegram-mcp/archive/refs/tags/v3.3.4.tar.gz
          sha=24bbd0b46742cd16e1d5898112f0417481b7c2b24c8d94d02ce8e4c78a52e0ea
          echo "fetching $url"
          python3 -c 'import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], "/src/src.tar.gz")' "$url"
          echo "$sha  /src/src.tar.gz" | sha256sum -c -
          tar -xzf /src/src.tar.gz -C /src --strip-components=1
          rm -f /src/src.tar.gz
          # --no-dev leaves out black/flake8/pytest; --python pins the
          # interpreter because UV_PYTHON_DOWNLOADS=never means uv must use the
          # image's own, not reach for a managed build.
          exec uv sync --frozen --no-dev --python /usr/local/bin/python3
        env:
        - name: UV_CACHE_DIR
          value: /cache
        - name: UV_PYTHON_DOWNLOADS
          value: never
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 768Mi
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: src
          mountPath: /src
        - name: uv-cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
      # Turn the sealed session string into the file session the server runs
      # on. Two reasons not to just hand the server the string:
      #
      #  - A string session carries the auth key but not Telethon's update
      #    state or entity cache, so every restart refetches a backlog and
      #    re-resolves every username. Upstream recommends a file session for
      #    a long-running server.
      #  - TELEGRAM_SESSION_STRING *wins over* TELEGRAM_SESSION_NAME in
      #    runtime.py (_discover_accounts checks the string first) -- the
      #    opposite of what the upstream README says. That is why the string is
      #    scoped to this container and never appears on the `mcp` one: with
      #    both set, the file on the volume would be silently ignored.
      #
      # Idempotent by hand, not by the migrator: `telegram-mcp-migrate-session`
      # refuses to overwrite an existing destination and exits non-zero, which
      # would crash-loop every restart after the first.
      - name: session
        image: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie-slim@sha256:6ff812e34a0e14b4b8bc9ddf25e77b3e16bac6e0c4d9b67641f40366fa382d4c
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -f /data/telegram_mcp_session.session ]; then
            echo "session file present, nothing to migrate"
            exit 0
          fi
          echo "no session file: migrating TELEGRAM_SESSION_STRING onto the volume"
          exec /src/.venv/bin/telegram-mcp-migrate-session --target /data/telegram_mcp_session
        env:
        - name: TELEGRAM_API_ID
          valueFrom:
            secretKeyRef:
              name: telegram-mcp-auth
              key: TELEGRAM_API_ID
        - name: TELEGRAM_API_HASH
          valueFrom:
            secretKeyRef:
              name: telegram-mcp-auth
              key: TELEGRAM_API_HASH
        # Only here. See the note above.
        - name: TELEGRAM_SESSION_STRING
          valueFrom:
            secretKeyRef:
              name: telegram-mcp-auth
              key: TELEGRAM_SESSION_STRING
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 20m
            memory: 96Mi
          limits:
            memory: 512Mi
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: src
          mountPath: /src
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      containers:
      # chigwell/telegram-mcp (Apache-2.0, Telethon over MTProto), run from the
      # venv the `source` init container built. github.com must be reachable
      # whenever the pod restarts -- the same bargain polymarket-mcp makes with
      # PyPI. /src is an emptyDir on purpose: it is rebuilt from the pinned tag
      # on every start, so the manifest is always what is running, rather than
      # a stale tree surviving on the volume past a bump.
      #
      # The package metadata reads 2.0.1 at tag v3.3.4 -- upstream does not bump
      # pyproject.toml. Trust the tag, not `pip show`.
      - name: mcp
        image: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie-slim@sha256:6ff812e34a0e14b4b8bc9ddf25e77b3e16bac6e0c4d9b67641f40366fa382d4c
        command:
        - /src/.venv/bin/telegram-mcp
        env:
        # Streamable HTTP at /mcp, on the pod's loopback: the auth container is
        # the one way in. There are no CLI flags for this, only these vars.
        - name: MCP_TRANSPORT
          value: http
        - name: MCP_HOST
          value: 127.0.0.1
        - name: MCP_PORT
          value: "8765"
        # DNS rebinding protection is off while this is unset. Turn it on and
        # allow exactly what nginx forwards as Host ($proxy_host). Belt and
        # braces: the listener is already loopback-only.
        - name: MCP_ALLOWED_HOSTS
          value: 127.0.0.1:*
        # The outer bound on what this server can do at all: `read-only` keeps
        # only the 65 tools annotated readOnlyHint=True and drops the other 82
        # -- every send_*, delete_*, edit_*, ban_*, join/leave, the profile and
        # privacy setters, and download_media. The Catalyst grant narrows it
        # further; this makes the pruned half unreachable even if a grant is
        # widened by accident. An unknown value here is a startup error, not a
        # silently different surface.
        #
        # `+send_message` re-registers exactly one of those 82, so the shopping
        # agent can answer on Telegram -- it has to ask which milk, and a tool
        # the server never registers is one no grant can reach. The additive
        # form is deliberate over a plain write mode: send_file, send_album,
        # send_reaction, forward_*, delete_* and the setters all stay dropped.
        # This is the one tool that can put text in front of another person, so
        # it is also the one that turns anything the agent reads into something
        # it could be talked into sending. Grant it to the shopping agent only.
        - name: TELEGRAM_EXPOSED_TOOLS
          value: read-only+send_message
        # The file session on the volume. Telethon appends `.session`, which is
        # the name the init container wrote.
        - name: TELEGRAM_SESSION_NAME
          value: /data/telegram_mcp_session
        - name: TELEGRAM_API_ID
          valueFrom:
            secretKeyRef:
              name: telegram-mcp-auth
              key: TELEGRAM_API_ID
        - name: TELEGRAM_API_HASH
          valueFrom:
            secretKeyRef:
              name: telegram-mcp-auth
              key: TELEGRAM_API_HASH
        # transcribe_voice is read-only, so it survives the pruning above, but
        # its default engine wants a GROQ_API_KEY and `auto` would ship voice
        # notes from private chats to a third party. Off also means no
        # plaintext transcript cache on the volume.
        - name: TELEGRAM_TRANSCRIBE
          value: "off"
        # How this shows up under Settings -> Devices on the phone, which is
        # also where it gets revoked. Without it Telethon reports the host
        # platform and the entry is unidentifiable.
        - name: TELEGRAM_DEVICE_MODEL
          value: homelab-catalyst-mcp
        - name: TZ
          value: Europe/Lisbon
        # Telethon and the MCP server write nothing here that matters: the
        # alias and incoming-feed state under $XDG_STATE_HOME is unused, since
        # set_contact_alias is pruned and TELEGRAM_EVENT_FEED is off.
        - name: HOME
          value: /tmp
        # Bound to loopback, so httpGet/tcpSocket probes (which dial the pod
        # IP) cannot see it; ask from inside the container instead.
        #
        # The install happens in an init container now, so this only has to
        # cover importing telethon/pillow/pypdf and connecting to Telegram. An
        # unauthorized session fails here rather than serving, which is the
        # intended signal.
        startupProbe:
          exec:
            command:
            - python3
            - -c
            - import socket; socket.create_connection(("127.0.0.1", 8765), 2)
          periodSeconds: 5
          failureThreshold: 36
        # Only proves the port is open. A wedged Telethon reconnect keeps
        # listening, so this will not catch it -- the logs will.
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import socket; socket.create_connection(("127.0.0.1", 8765), 2)
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 160Mi
          limits:
            # pillow and pypdf are imported at start, and the entity-cache warm
            # pulls every dialog once.
            memory: 768Mi
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        # Read-only here: the guard re-reads /src/pyproject.toml at startup,
        # but nothing in this container should be writing to the source tree.
        - name: src
          mountPath: /src
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      - name: auth
        image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
        env:
        - name: MCP_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-mcp-auth
              key: MCP_BEARER_TOKEN
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        # Runs as the image's own user (101). It renders the template into
        # /etc/nginx/conf.d at start, which is nginx:root 775 -- a pod-wide
        # runAsUser would leave it unwritable.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: auth-template
          mountPath: /etc/nginx/templates
          readOnly: true
      volumes:
      # The source tree plus its .venv, rebuilt from the pinned tag on every
      # pod start. Not on the PVC: see the note on the `mcp` container.
      - name: src
        emptyDir: {}
      - name: uv-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: auth-template
        configMap:
          name: telegram-mcp-auth
  # RWO on Longhorn: a real block device with ext4 under Telethon's SQLite
  # session. Longhorn RWX would put an NFS share-manager in front, which is the
  # arrangement SQLite corrupts under (see vaultwarden).
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: longhorn
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
