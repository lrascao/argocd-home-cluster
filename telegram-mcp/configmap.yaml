# The bearer check in front of telegram-mcp, which has no auth of its own.
# Same shape as polymarket-mcp/configmap.yaml -- the nginx image renders
# /etc/nginx/templates/*.template into conf.d at start, substituting only
# environment variables that are actually set (here just ${MCP_BEARER_TOKEN});
# nginx's own $variables pass through untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-mcp-auth
  namespace: telegram-mcp
data:
  default.conf.template: |
    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            # A plain comparison, not a `map`: a map keyed on the full
            # "Bearer <token>" string overflows map_hash_bucket_size.
            if ($http_authorization != "Bearer ${MCP_BEARER_TOKEN}") {
                return 401;
            }

            # Host stays nginx's default, $proxy_host (127.0.0.1:8765). Unlike
            # polymarket, this server leaves DNS rebinding protection OFF
            # unless MCP_ALLOWED_HOSTS is set -- and the StatefulSet sets it to
            # 127.0.0.1:*, which is exactly what $proxy_host sends. So the
            # effect is the same: don't add `proxy_set_header Host`, or every
            # call gets a 421.
            proxy_pass http://127.0.0.1:8765;
            # MCP_ALLOWED_ORIGINS is left unset, so any Origin that is present
            # would be rejected; strip it, as for polymarket.
            proxy_set_header Origin "";

            # Streamable HTTP answers with SSE streams: no buffering, keep the
            # upstream connection HTTP/1.1, and outlast long tool calls. The
            # read timeout has to cover the wait_for_* tools, which block on
            # new messages up to TELEGRAM_TOOL_TIMEOUT_SECONDS (55s default).
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
