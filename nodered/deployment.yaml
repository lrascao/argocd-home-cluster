apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: nodered
  name: nodered
  labels:
    app: nodered
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      containers:
      - name: nodered
        image: nodered/node-red
        args: ["--settings", "/nodered/config/settings.js", "--port", "1880", "--userDir", "/nodered/data"]
        env:
        - name: NODE_RED_DBUS_ADDRESS
          value: 192.168.3.54:78 # cerbogx.home but need ip address
        ports:
        - containerPort: 1880
        volumeMounts:
        - name: conf-nodered
          mountPath: "/nodered/config"
          readOnly: true
        - name: data-nodered
          mountPath: /nodered/data
      volumes:
      - name: conf-nodered
        configMap:
          name: nodered
      - name: data-nodered
        persistentVolumeClaim:
          claimName: pvc-nodered
