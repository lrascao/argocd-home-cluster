local:
  namespace: eufy

  bridge:
    # ha-eufy-sdk-bridge. Note which project this is: every older guide points
    # at bropat/eufy-security-ws, and that was archived on 2026-09-12 with
    # development moved to mega-yfue/eufy-sdk. The successor is young.
    #
    # Pinned, and not upstream's image: upstream 0.6.0 plus one patch, built in
    # ansible-local-network/services/eufy-bridge (`make push`). Upstream's
    # on-detection refresh could store an EARLIER event's picture as a new
    # detection's -- a person at the door, a photo of an empty driveway from
    # seven events before -- and the patch makes a detection fetch its own
    # event's cover and name its record_id. It is offered upstream; when a
    # release carries it, point this back at ghcr.io/mega-yfue/... pinned to
    # that release. services/eufy-bridge/README.md has the detail.
    #
    # Still the cameras' only path, so a bad bridge takes the notifications out
    # silently -- the health topics below exist for exactly that.
    image: registry.88288338.xyz/ha-eufy-sdk-bridge:0.6.0-owncover.1

    storage:
      # Sized from what the bridge actually writes, which is bounded:
      # `.eufy-session.json` (a few KB) and one `last-event-<sn>.jpg` per
      # camera, overwritten in place rather than accumulated -- so ~2MB for
      # two cameras, and it grows with neither time nor event count. The
      # event log goes to stdout, not here.
      #
      # 128Mi is ~60x that, in keeping with mqtt-data (100Mi) and grafana
      # (96Mi). The size matters even though longhorn is thin-provisioned,
      # because the scheduler reserves the *requested* size on every replica
      # and numberOfReplicas is 3 -- so this reserves 384Mi, not 3Gi.
      #
      # What must not happen is this filling: the session file is what keeps
      # 2FA a first-run step rather than a recurring chore.
      size: 128Mi

  shim:
    # Built from ansible-local-network/services/eufy-mqtt (`make push`).
    # The tag here and services/eufy-mqtt/VERSION are two halves of one thing
    # and nothing checks that they agree -- bump both in the same change.
    image: registry.88288338.xyz/eufy-mqtt:0.1.4

  mqtt:
    # The mosquitto Service in the `mqtt` namespace of this same repo.
    host: mqtt.mqtt.svc.cluster.local
    port: 1883
    prefix: eufy

  # Serials, not device names. Renaming a camera in the eufy app would
  # otherwise silently move its topic out from under every subscriber; the
  # friendly name is published on eufy/<sn>/info instead.
  topicKey: sn

  # Publish the frame each detection fired on, retained, to
  # eufy/<sn>/event_image. Sourced from the bridge's /event-image/ endpoint
  # when it emits `eventImageUpdated` -- never /snapshot/, which opens a live
  # P2P burst to the camera: slow enough to outrun a 10s timeout in
  # production, and it returns what is in view *now* rather than what
  # triggered the alert. Set to false to stop publishing images entirely.
  eventImage: true

  # The ONLY properties that may be written over MQTT, as SERIAL.property,
  # comma separated -- publish a JSON value to eufy/<sn>/set/<property>.
  #
  # An allowlist and never a wildcard: mosquitto here is anonymous and open
  # to the whole LAN, and the HomeBase exposes a writable `armingMode`, so a
  # pass-through would let any device on the wifi disarm the alarm with one
  # publish. Add a pair here only for a property something actually needs.
  #
  # Front Door floodlight on/off, for the Node-RED night-light flow. Brightness
  # is deliberately left out until something needs it.
  writable: "T8425T23251202B3.light"

  heartbeatSeconds: 60

  # eufy cloud credentials. Use a DEDICATED account invited to the real one:
  # the account allows a single active session, so sharing credentials with
  # the phone app means the bridge and the app fight over it.
  secretName: eufy-credentials
