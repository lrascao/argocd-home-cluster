# The seam between Home Assistant and an LLM that is allowed to disappear.
#
# WHY THIS EXISTS AT ALL. The anchor workload -- voice -- depends on a node
# that is designed to be destroyed. Without something here, that dependency
# fails in two ways, and the second one is much worse than the first:
#
#   1. An open-ended question raises inside the conversation agent. The
#      Assist pipeline turns that into IntentRecognitionError and ABORTS --
#      it never reaches the TTS stage, so what a person standing in the
#      kitchen gets is not an apology, it is silence.
#
#   2. Home Assistant restarts while the cloud node is gone. openai_
#      conversation's async_setup_entry calls models.list() and raises
#      ConfigEntryNotReady when it fails, so the conversation ENTITY never
#      appears. The pipeline points at a missing agent, and now "turn off
#      the kitchen light" is broken too -- device control taken down by the
#      absence of a model it never needed.
#
# So this proxy sits on the LAN, between HA and the cloud node, and its
# entire job is to make sure neither of those reaches Home Assistant. When
# the upstream is there it gets out of the way. When it is not, it answers
# in vLLM's own Responses-API event shape with one spoken sentence, as a
# perfectly ordinary 200. The pipeline cannot tell the difference, so it
# runs to completion and the person hears why.
#
# It is on the LAN and not beside vLLM for the obvious reason: a fallback
# that lives on the machine that failed is not a fallback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-app
  namespace: voice
  labels:
    app: llm-gateway
    app.kubernetes.io/part-of: voice
data:
  gateway.py: |
    """OpenAI-shaped proxy that degrades to a spoken sentence.

    Stdlib only, and deliberately so: it runs from a ConfigMap on a stock
    python image, so there is no image to build and no registry to reach --
    which matters for a component whose whole purpose is being available
    when other things are not.
    """

    import http.server
    import json
    import os
    import socketserver
    import threading
    import time
    import urllib.error
    import urllib.request

    UPSTREAM = os.environ["UPSTREAM"]
    MODEL = os.environ["MODEL_NAME"]
    DEGRADED_TEXT = os.environ["DEGRADED_TEXT"]
    CONNECT_TIMEOUT = float(os.environ.get("CONNECT_TIMEOUT", "2"))
    HEALTH_PERIOD = float(os.environ.get("HEALTH_PERIOD", "5"))

    STATE = {"up": False, "since": time.time(), "checks": 0}
    COUNTS = {"proxied": 0, "degraded": 0, "truncated": 0}
    LOCK = threading.Lock()


    def health_loop():
        """Poll upstream so a request never pays for discovering it is gone.

        Without this every degraded reply would first burn CONNECT_TIMEOUT
        finding out, and that wait lands on someone waiting to be answered.
        With it, the common case -- node destroyed hours ago -- is known
        before the question is even asked, and the fallback is instant.
        """
        while True:
            up = False
            try:
                with urllib.request.urlopen(
                    UPSTREAM + "/health", timeout=CONNECT_TIMEOUT
                ) as r:
                    up = r.status == 200
            except Exception:
                up = False
            with LOCK:
                if up != STATE["up"]:
                    STATE["since"] = time.time()
                    print(
                        f"upstream {'UP' if up else 'DOWN'}: {UPSTREAM}",
                        flush=True,
                    )
                STATE["up"] = up
                STATE["checks"] += 1
            time.sleep(HEALTH_PERIOD)


    def sse(event_type, obj):
        return (
            f"event: {event_type}\n".encode()
            + b"data: "
            + json.dumps(obj).encode()
            + b"\n\n"
        )


    def degraded_stream(model):
        """vLLM's own Responses event sequence, carrying one sentence.

        Replayed rather than invented: the order and field names below were
        captured from this vLLM build, because the openai SDK parses these
        into typed events and HA's _transform_stream dispatches on the type.
        The three that actually matter to HA are output_item.added (opens the
        assistant message), output_text.delta (the words) and completed. The
        rest are sent because the SDK expects a well-formed stream and a
        half-formed one fails in the client, which is the failure this whole
        component exists to prevent.
        """
        rid = "resp_degraded"
        iid = "msg_degraded"
        base = {
            "id": rid,
            "created_at": int(time.time()),
            "incomplete_details": None,
            "instructions": None,
            "metadata": None,
            "model": model,
            "object": "response",
            "output": [],
            "parallel_tool_calls": True,
            "temperature": 1.0,
            "tool_choice": "none",
            "tools": [],
            "top_p": 1.0,
            "status": "in_progress",
        }
        n = 0

        def nxt():
            nonlocal n
            n += 1
            return n - 1

        yield sse(
            "response.created",
            {"response": base, "sequence_number": nxt(), "type": "response.created"},
        )
        yield sse(
            "response.in_progress",
            {
                "response": base,
                "sequence_number": nxt(),
                "type": "response.in_progress",
            },
        )
        yield sse(
            "response.output_item.added",
            {
                "item": {
                    "id": iid,
                    "content": [],
                    "role": "assistant",
                    "status": "in_progress",
                    "type": "message",
                },
                "output_index": 0,
                "sequence_number": nxt(),
                "type": "response.output_item.added",
            },
        )
        yield sse(
            "response.content_part.added",
            {
                "content_index": 0,
                "item_id": iid,
                "output_index": 0,
                "part": {
                    "annotations": [],
                    "text": "",
                    "type": "output_text",
                    "logprobs": [],
                },
                "sequence_number": nxt(),
                "type": "response.content_part.added",
            },
        )
        # Word at a time, so a streaming TTS starts speaking at the same
        # point it would on a real answer rather than all at once.
        words = DEGRADED_TEXT.split(" ")
        for i, w in enumerate(words):
            yield sse(
                "response.output_text.delta",
                {
                    "content_index": 0,
                    "delta": (w if i == 0 else " " + w),
                    "item_id": iid,
                    "output_index": 0,
                    "sequence_number": nxt(),
                    "type": "response.output_text.delta",
                    "logprobs": [],
                },
            )
        yield sse(
            "response.output_text.done",
            {
                "content_index": 0,
                "item_id": iid,
                "logprobs": [],
                "output_index": 0,
                "sequence_number": nxt(),
                "text": DEGRADED_TEXT,
                "type": "response.output_text.done",
            },
        )
        done_item = {
            "id": iid,
            "content": [
                {
                    "annotations": [],
                    "text": DEGRADED_TEXT,
                    "type": "output_text",
                    "logprobs": None,
                }
            ],
            "role": "assistant",
            "status": "completed",
            "type": "message",
            "summary": [],
        }
        yield sse(
            "response.content_part.done",
            {
                "content_index": 0,
                "item_id": iid,
                "output_index": 0,
                "part": done_item["content"][0],
                "sequence_number": nxt(),
                "type": "response.content_part.done",
            },
        )
        yield sse(
            "response.output_item.done",
            {
                "item": done_item,
                "output_index": 0,
                "sequence_number": nxt(),
                "type": "response.output_item.done",
            },
        )
        final = dict(base)
        final["status"] = "completed"
        final["output"] = [done_item]
        final["usage"] = {
            "input_tokens": 0,
            "output_tokens": 0,
            "total_tokens": 0,
            "input_tokens_details": {"cached_tokens": 0},
            "output_tokens_details": {"reasoning_tokens": 0},
        }
        yield sse(
            "response.completed",
            {
                "response": final,
                "sequence_number": nxt(),
                "type": "response.completed",
            },
        )
        yield b"data: [DONE]\n\n"


    class Handler(http.server.BaseHTTPRequestHandler):
        # HTTP/1.0 on purpose: the response body ends at connection close,
        # which is a legal way to frame a stream of unknown length and saves
        # implementing chunked encoding by hand. httpx reads to EOF.
        protocol_version = "HTTP/1.0"
        server_version = "voice-llm-gateway/1"

        def log_message(self, fmt, *args):
            pass  # the access log would be one line per health probe

        def _send(self, code, body, ctype="application/json"):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _upstream_up(self):
            with LOCK:
                return STATE["up"]

        def _count(self, key):
            with LOCK:
                COUNTS[key] += 1

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, b'{"ok":true}')
                return
            if self.path == "/metrics":
                with LOCK:
                    up, counts, since = STATE["up"], dict(COUNTS), STATE["since"]
                # %-formatting, not f-strings, for the labelled lines, and
                # the reason is Helm rather than taste. A doubled left brace
                # anywhere in this file is a Go template action and the chart
                # fails to parse -- and in an f-string a literal brace has to
                # be doubled, so a Prometheus label written the obvious way
                # is exactly the thing Helm reads as its own.
                line = 'voice_llm_gateway_requests_total{outcome="%s"} %d\n'
                body = (
                    "# HELP voice_llm_gateway_upstream_up Upstream vLLM reachable.\n"
                    "# TYPE voice_llm_gateway_upstream_up gauge\n"
                    "voice_llm_gateway_upstream_up %d\n" % (1 if up else 0)
                    + "# HELP voice_llm_gateway_upstream_state_seconds Seconds in the current up/down state.\n"
                    "# TYPE voice_llm_gateway_upstream_state_seconds gauge\n"
                    "voice_llm_gateway_upstream_state_seconds %.0f\n"
                    % (time.time() - since)
                    + "# HELP voice_llm_gateway_requests_total Conversation requests by outcome.\n"
                    "# TYPE voice_llm_gateway_requests_total counter\n"
                    + line % ("proxied", counts["proxied"])
                    + line % ("degraded", counts["degraded"])
                    + line % ("truncated", counts["truncated"])
                ).encode()
                self._send(200, body, "text/plain; version=0.0.4")
                return

            if self.path.startswith("/v1/models") and not self._upstream_up():
                # Answered from here rather than failed, and this is the case
                # that keeps device control alive. HA calls models.list() on
                # every setup of the config entry; letting it fail removes the
                # conversation entity, which breaks the pipeline that owns
                # "turn off the kitchen light" -- a command that never needed
                # the model in the first place.
                body = json.dumps(
                    {
                        "object": "list",
                        "data": [
                            {
                                "id": MODEL,
                                "object": "model",
                                "created": int(time.time()),
                                "owned_by": "voice-llm-gateway",
                            }
                        ],
                    }
                ).encode()
                self._send(200, body)
                return
            self._proxy("GET", None)

        def do_POST(self):
            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length) if length else b""
            if not self._upstream_up():
                self._degrade(body)
                return
            self._proxy("POST", body)

        def _wants_stream(self, body):
            try:
                return bool(json.loads(body or b"{}").get("stream"))
            except ValueError:
                return False

        def _degrade(self, body):
            self._count("degraded")
            if not self._wants_stream(body):
                payload = {
                    "id": "resp_degraded",
                    "object": "response",
                    "created_at": int(time.time()),
                    "model": MODEL,
                    "status": "completed",
                    "output": [
                        {
                            "id": "msg_degraded",
                            "type": "message",
                            "role": "assistant",
                            "status": "completed",
                            "content": [
                                {
                                    "type": "output_text",
                                    "text": DEGRADED_TEXT,
                                    "annotations": [],
                                }
                            ],
                        }
                    ],
                    "usage": {
                        "input_tokens": 0,
                        "output_tokens": 0,
                        "total_tokens": 0,
                    },
                }
                self._send(200, json.dumps(payload).encode())
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/event-stream")
            self.send_header("Cache-Control", "no-cache")
            self.end_headers()
            for chunk in degraded_stream(MODEL):
                self.wfile.write(chunk)
                self.wfile.flush()

        def _proxy(self, method, body):
            req = urllib.request.Request(
                UPSTREAM + self.path, data=body, method=method
            )
            for h in ("Content-Type", "Authorization", "Accept"):
                if self.headers.get(h):
                    req.add_header(h, self.headers[h])
            try:
                # No total timeout: generation on a CPU backend legitimately
                # takes tens of seconds, and cutting a real answer short is a
                # worse failure than the one being guarded against. The
                # health poll is what catches "gone", not a stopwatch here.
                upstream = urllib.request.urlopen(req, timeout=CONNECT_TIMEOUT)
            except urllib.error.HTTPError as e:
                # A real answer from the model, including its 400s. Passed
                # through untouched -- this proxy is not in the business of
                # editing vLLM's opinions.
                self._count("proxied")
                data = e.read()
                self._send(
                    e.code, data, e.headers.get("Content-Type", "application/json")
                )
                return
            except Exception:
                # Health said up, the socket disagreed. Degrade rather than
                # propagate: nothing has been written to the client yet, so
                # this is still recoverable into a spoken sentence.
                self._degrade(body)
                return

            self._count("proxied")
            self.send_response(upstream.status)
            ctype = upstream.headers.get("Content-Type", "application/json")
            self.send_header("Content-Type", ctype)
            self.end_headers()
            try:
                while True:
                    chunk = upstream.read(1024)
                    if not chunk:
                        break
                    self.wfile.write(chunk)
                    self.wfile.flush()
            except Exception:
                # Upstream died mid-answer. Bytes are already on the wire, so
                # there is no degrading now -- the client keeps the partial
                # sentence. Counted separately because it is a different
                # event from a clean fallback and should look different on
                # the dashboard.
                self._count("truncated")


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True
        allow_reuse_address = True


    if __name__ == "__main__":
        threading.Thread(target=health_loop, daemon=True).start()
        print(f"listening on :8000, upstream {UPSTREAM}", flush=True)
        Server(("0.0.0.0", 8000), Handler).serve_forever()
