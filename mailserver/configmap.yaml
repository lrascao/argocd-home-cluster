# Non-secret DMS config. These land in /tmp/docker-mailserver/ via the
# init container (see deployment.yaml) -- NOT mounted read-only directly,
# because DMS chowns/chmods that directory on startup and a read-only
# mount makes it fail. That is exactly how the old `mailforwarder` broke
# its DKIM setup: the key directory was a read-only ConfigMap, key
# generation failed against it, and opendkim ran for two years with no key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailserver-config
  namespace: mailserver
data:
  # Catch-all: anything @88288338.xyz lands in the one real mailbox.
  # Keeps the behaviour the old forwarder had (SMF_CONFIG was a catch-all),
  # so per-service addresses like amazon@88288338.xyz keep working.
  postfix-virtual.cf: |
    @88288338.xyz luis@88288338.xyz

  # Deliver locally AND forward a copy to Gmail. `:copy` is the important
  # part -- without it, redirect forwards and does NOT keep a local copy,
  # which would leave you with no mailbox on your own server.
  #
  # Combined with ENABLE_SRS=1, the forwarded copy leaves with an SRS-rewritten
  # envelope sender, so it passes SPF at Google instead of being spam-filed
  # for forging the original sender's domain.
  # Key is `dovecot.sieve`, NOT `luis@88288338.xyz.dovecot.sieve`: a ConfigMap
  # key must match [-._a-zA-Z0-9]+ and `@` is rejected by the API server. The
  # real filename DMS expects is restored by the volume item path in
  # deployment.yaml, which is a file path and has no such restriction.
  dovecot.sieve: |
    require ["copy"];
    redirect :copy "luis.rascao+88288338.xyz@gmail.com";

  # DMS runs this as root late in startup -- its documented extension point.
  # The DKIM key arrives from a Secret owned by root:root 0600, but opendkim
  # drops to the `opendkim` user and then cannot read its own key. It does not
  # fail open: it returns a tempfail to postfix, and EVERY message -- inbound
  # included -- gets deferred with `milter-reject ... 4.7.1`.
  #
  # Resolving the user by NAME here rather than by uid in the init container,
  # because the numeric id (102:104 today) is an implementation detail of the
  # image and would rot silently on a version bump.
  user-patches.sh: |
    #!/bin/bash
    chown -R opendkim:opendkim /tmp/docker-mailserver/opendkim
    chmod 700 /tmp/docker-mailserver/opendkim/keys/88288338.xyz
    chmod 600 /tmp/docker-mailserver/opendkim/keys/88288338.xyz/mail.private

  # Appended to postfix main.cf.
  postfix-main.cf: |
    # Match the size limit the old forwarder advertised (40MB).
    message_size_limit = 40960000
    # Gmail is the spam filter for anything that gets forwarded, but reject
    # the obvious garbage at the door so it never hits the queue.
    smtpd_helo_required = yes

    # Throttle password guessing on :587. Only meaningful now that PROXY
    # protocol gives anvil a real per-client address -- before that every
    # client shared one flannel-gateway IP and this would have been a single
    # shared bucket for the whole internet.
    #
    # AUTH rate only, deliberately: haproxy health-checks each node roughly
    # 30x/minute, so a connection-rate limit would throttle our own backends.
    # Health checks never authenticate, so they cannot trip this one. A real
    # client authenticates once per send; the brute-force traffic here does
    # far more than ten attempts a minute.
    #
    # Note this throttles, it does not block -- a ban has to happen in haproxy,
    # which sees the true source at the network layer. fail2ban inside the pod
    # cannot work: the PROXY header is an application-layer declaration, so
    # packets still physically arrive from 10.200.x.x and an nftables rule on
    # the attacker's real address would match nothing.
    smtpd_client_auth_rate_limit = 10

  # PROXY protocol. Must be flipped in the SAME commit as `send-proxy` on the
  # haproxy backends -- either side alone breaks the listener outright.
  #
  # NOTE the two different parameter names. :25 is served by POSTSCREEN
  # (master.cf: `smtp inet ... postscreen`), so it takes
  # postscreen_upstream_proxy_protocol; :587 is served by smtpd directly and
  # takes smtpd_upstream_proxy_protocol. Using the smtpd_ name on :25 is
  # accepted silently and does nothing.
  postfix-master.cf: |
    smtp/inet/postscreen_upstream_proxy_protocol=haproxy
    submission/inet/smtpd_upstream_proxy_protocol=haproxy

