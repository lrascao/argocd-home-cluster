apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: daikin-system
  name: daikin
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    # An Ingress secretName is validated as an RFC 1123 subdomain, so the
    # "namespace/name" form an HTTPProxy takes is rejected by the apiserver
    # before contour sees it. This annotation is how contour is told which
    # namespace to read the delegated wildcard from.
    projectcontour.io/tls-cert-namespace: acme
spec:
  ingressClassName: contour
  tls:
  - secretName: wildcard-88288338-xyz
    hosts:
    - daikin.88288338.xyz
  rules:
  - host: daikin.88288338.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: daikin
            port:
              number: 8080

