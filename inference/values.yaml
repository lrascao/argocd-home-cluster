local:
  vllm:
    # Pinned, not :latest. vLLM's CPU backend is a separate image from the
    # CUDA one -- vllm/vllm-openai is GPU-only and will not start here.
    image: vllm/vllm-openai-cpu:v0.27.1-x86_64

    # Which node this serves from, and therefore which half of the chart
    # applies. Off is the CPU backend on a CloudNative node, which is what
    # this has always been; on is a burst GPU session (see the L40S notes in
    # ansible-local-network's docs/inference-lab-and-healthcheck.md).
    #
    # A toggle rather than a second chart because only four things differ:
    # the image, one resource limit, the extra taint/label, and two env vars
    # that mean nothing without a CPU backend. Everything that took B-1 and
    # B-2 to get right -- the probe budget, the weights initContainer, the
    # thinking-off default, /dev/shm -- is the same on both.
    #
    # MEASURED on an L40S (2026-09-23), Qwen3-1.7B, against 29 tok/s for the
    # same model on the 8-vCPU CPU node:
    #
    #                  1.7B BF16      14B BF16      32B AWQ (4-bit)
    #   weights        3.4 GB         27.5 GiB      18.2 GiB
    #   1 request      167-173 tok/s  26 tok/s      38 tok/s
    #   8 concurrent   1,333 tok/s    190 tok/s     286 tok/s
    #   32 concurrent  3,556 tok/s    653 tok/s     941 tok/s
    #   KV cache       338,336 tok    75,808 tok    85,312 tok
    #
    # The 32B at 4-bit beats the 14B at BF16 on every line despite 2.3x the
    # parameters, because it moves fewer bytes per token -- both sit at ~86%
    # of the L40S's bandwidth ceiling. Choose a model here by its BYTES.
    #
    # THAT RULE HAS A CEILING, measured on an H100 80GB HBM3 on 2026-11-05
    # with the same Qwen3-32B-AWQ. The H100 moves 3,350 GB/s against the
    # L40S's 864 -- 3.88x -- and delivered 1.98x:
    #
    #                  L40S          H100          ratio
    #   1 request       38 tok/s      75 tok/s     1.98x
    #   8 concurrent   286 tok/s     584 tok/s     2.04x
    #   32 concurrent  941 tok/s   2,131 tok/s     2.26x
    #   per-stream@32  ~29 tok/s    67.2 tok/s     2.3x
    #   KV cache     85,312 tok  211,552 tok       2.48x
    #
    # 75 tok/s over 18.0 GiB of weights is ~1,500 GB/s effective -- 45% of
    # the card, against 86% on the L40S. The bytes did not change, so the
    # BOTTLENECK MOVED: AWQ's MacheteLinearKernel has to unpack int4 to bf16
    # before every GEMM, and on Hopper that unpack, not the HBM read, is what
    # sets the rate. So "choose by bytes" holds while the kernel can keep the
    # memory bus busy and stops holding when it cannot.
    #
    # Practical consequence, and it only applies on the H100: there, a wider,
    # natively-supported format can beat a narrower one that needs
    # dequantising, because Hopper has FP8 tensor cores and no int4 path. The
    # model below stays 4-bit AWQ, which is the measured right answer on the
    # L40S (86% of the card's ceiling) and is what this is pointed at again.
    # If the H100 fallback is ever taken, do not assume the 4-bit column
    # wins there the way it won here -- measure both, cheaply, first.
    #
    # Read the 14B column before choosing a model. Generation on this card is
    # memory-bandwidth-bound exactly as it is on the CPU node: the L40S moves
    # ~864 GB/s, so 27.5 GiB of weights caps it near 30 tok/s and it measured
    # 26 -- SLOWER, single-stream, than the 1.7B managed on the CPU node at
    # 29. A GPU here buys a bigger model, not a faster one.
    #
    # What it does buy outright is concurrency: 46 GB of VRAM holds a KV cache
    # deep enough that requests batch instead of queueing, which is the whole
    # argument for vLLM over llama.cpp -- and 653 tok/s aggregate on a model
    # the CPU backend could not load in BF16 at all.
    gpu:
      enabled: true
      # The CUDA image. Same vLLM version as the CPU one above; bump together.
      image: vllm/vllm-openai:v0.27.1
      # Matches node.homelab/gpu, which cloud-init derives from nvidia-smi --
      # the WHOLE sanitised name, not the card family. "NVIDIA L40S" gives
      # l40s, but "NVIDIA H100 80GB HBM3" gives h100-80gb-hbm3, and a bare
      # h100 here matches nothing: the pod sits Pending on a healthy node
      # billed by the GPU-hour. Read the label off the node, do not guess it.
      #
      # THIS MOVES WITH ansible-local-network's config.yaml, which declares
      # the plan and therefore the card. Those two now offer both -- a spot
      # L40S live and an H100 commented underneath, because UpCloud's
      # capacity decides which one can be bought on the day -- and switching
      # there without switching here is the silent half of the pair: the
      # session boots, the node reads Ready, and this pod waits for a label
      # nothing has. l40s for GPU-SPOT-8xCPU-64GB-1xL40S,
      # h100-80gb-hbm3 for GPU-SPOT-12xCPU-240GB-1xH100.
      model: l40s
      count: 1

    # Qwen3-1.7B, stepped back DOWN from the 4B, and the reason is latency
    # rather than anything about the model's answers.
    #
    # B-1 measured both on this hardware. Generation is what a person waiting
    # for a spoken reply experiences, and it does not scale with parameters
    # the way the byte arithmetic predicts:
    #
    #                  generation   40-token reply   verdict
    #   Qwen3-1.7B      29 tok/s        ~1.4 s       conversational
    #   Qwen3-4B         9.0 tok/s      ~4.4 s       too slow to talk to
    #
    # 2.4x the weights cost 3.2x the time, not 2.4x -- the 4B's 36 layers
    # against the 1.7B's 28 add per-layer overhead the CPU path does not
    # amortise, so it reaches only ~72 GB/s effective against the 1.7B's ~99.
    # The 4B is the better model and the wrong one for a voice assistant;
    # 4.4 s of silence after a question reads as broken, not as thoughtful.
    #
    # If this node is ever replaced by a GPU one, revisit: the ranking is a
    # property of CPU generation speed, not of the models.
    #
    # Those benchmark numbers elsewhere in the doc come from llama.cpp at
    # Q4_K_M, where an 8B is 4.68 GiB. vLLM's CPU backend has no such
    # quantisation path -- BF16 is its default and what AVX-512 accelerates --
    # so the same 8B here is ~16 GB of weights, not 4.68, and does not fit.
    # The model that fits is decided by the serving runtime's dtype, not by
    # the GGUF size.
    #
    # Weights, maxLen and kvCacheSpaceGiB are one budget against 23.3 GiB of
    # allocatable node. What the two candidates cost:
    #
    #                     weights   KV/token   40960-ctx KV   total @8GiB KV
    #   Qwen3-1.7B (here)  3.4 GB    112 KiB       4.4 GiB        ~14 GiB
    #   Qwen3-4B           8.0 GB    144 KiB       5.6 GiB        ~18 GiB
    #
    # (1.7B: 28 layers x 8 kv-heads x 128 head-dim, from its own config.json;
    # same 40960 max_position_embeddings, so maxLen did not change coming
    # back down.)
    #
    # Do not lower maxLen to make room. That is the knob that failed first
    # here and it fails as a 500 per request, not as an OOM.
    model:
      # Qwen3-32B, AWQ 4-bit (18.0 GiB) -- chosen over the FP8 build (~33 GB)
      # for the reason the 14B measurement exposed: generation here is
      # bandwidth-bound, so halving the bytes per token is what buys speed.
      # L40S at ~864 GB/s over ~19 GB puts the ceiling near 45 tok/s, against
      # 26 measured for the 14B in BF16. vLLM detects AWQ from the model's
      # own config; no quantization flag is needed.
      #
      # STAYING HERE DELIBERATELY, 2026-11-05, after costing out the step up.
      # The workload is tool dispatch on short prompts -- shopping lists via
      # continente-mcp, market reads via polymarket-mcp, replies via
      # whatsapp-mcp -- so the model picks one of ~17 tools, fills its
      # parameters and says one sentence. A 32B is already past what that
      # needs, every failure on this path so far has been plumbing rather
      # than capability, and continente-mcp drives a real logged-in browser
      # session, which makes a silently-dropped tool call the expensive
      # failure. A newer model re-opens exactly that risk for a quality gain
      # nothing here would notice.
      #
      # What was evaluated, with real safetensors sizes, against 74.5 GiB of
      # H100 -- keep this list, the sizes are the hard part:
      #
      #   Qwen/Qwen3.8-27B-FP8                28.7 GiB  newest dense
      #   Qwen/Qwen3.5-35B-A3B-FP8            34.9 GiB  hybrid MoE, 3B active
      #   cyankiwi/...Next-80B-A3B-AWQ-4bit   45.9 GiB  community quant
      #   Qwen/Qwen3.5-122B-A10B-GPTQ-Int4    73.4 GiB  DOES NOT FIT: weights
      #                                                 alone leave no KV
      #   Qwen/Qwen3-235B-A22B-Instruct-2507-FP8  220.2 GiB  ~3 cards
      #
      # Note there is no dense Qwen3 above 32B -- this IS the top of that
      # line, and Qwen has since moved to 3.5/3.6/3.8 where the dense
      # flagship came DOWN to 27B. vLLM 0.27.1 already registers
      # Qwen3_5MoeForConditionalGeneration, so the pinned image could serve
      # any of them without a bump.
      #
      # IF THIS EVER CHANGES, the tool parser changes with it in the same
      # edit -- see the parser note below. Qwen3.5 wants qwen3_xml, the exact
      # opposite of this checkpoint's answer, and getting it wrong is an
      # HTTP 200 with the call as plain text.
      #
      # The more interesting experiment for this workload is DOWNWARD: a
      # 9B-class model from the 3.5 generation would be a fraction of the
      # bytes and several times faster, and 17-way tool dispatch on short
      # prompts is unlikely to notice. Untested.
      name: Qwen/Qwen3-32B-AWQ
      # CLIENT-VISIBLE CONTRACT. This is the OpenAI model id, so every caller
      # that names it 404s if it changes -- Home Assistant's
      # openai_conversation model field and
      # `diagrid managed-agent update agent1 --llm-model`.
      servedName: qwen3-32b-awq
      # 40960 -- the model's own max_position_embeddings, so this is the
      # ceiling rather than a choice. NOT a leftover: this checkpoint reports
      # max_position_embeddings=40960 and vLLM REFUSES TO START above it, so
      # the 262144 that suited the 3.5 MoE is a startup failure here.
      #
      # It was 8192, which is plenty for a chat client and nowhere near enough
      # for an agentic one. Claude Code sends its system prompt and tool
      # definitions on every request: 129,497 characters, ~32k tokens, before
      # the user has typed anything. Add the 8192 output tokens it asks for
      # and a single "hello" needs ~40k of context, so every request failed
      # with a 500 out of /v1/messages:
      #
      #   maximum context length is 8192 tokens. However, you requested 8192
      #   output tokens and your prompt contains 129497 characters
      #
      # That was Claude Code as a client, not the workloads this actually
      # serves -- HA voice and the MCP agents send a few hundred tokens.
      #
      # KV cost here is 2 x 64 layers x 8 kv-heads x 128 head-dim x 2 B
      # = 256 KiB per token, which is why the H100 held 211,552 tokens
      # (51.6 GiB) after 18.0 GiB of weights at the default 0.9 utilisation.
      #
      # Raising this is not free -- see kvCacheSpaceGiB below, which has to
      # move with it on the CPU backend, and the prefill cost in the plan doc.
      #
      # And 40960 is a CEILING, not a dial. 40961 was tried and vLLM refused
      # to start:
      #
      #   User-specified max_model_len (40961) is greater than the derived
      #   max_model_len (max_position_embeddings=40960)
      #
      # There is a VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 override, and it is a trap
      # here: this model uses RoPE, and positions beyond the trained maximum
      # produce nan rather than an error. The way past 40960 is rope scaling
      # (YaRN), with its own KV cost, not a +1.
      #
      # If a client needs prompt + max_tokens to fit, the number that has to
      # come down is the client's max_tokens.
      maxLen: 40960

      # Qwen3 is a hybrid reasoning model and its chat template turns
      # thinking ON unless told otherwise. For a voice assistant that is not
      # a quality setting, it is a correctness one -- measured here against
      # Home Assistant's own request shape, max_output_tokens 150:
      #
      #   thinking on   150 output tokens, status "incomplete", reason
      #                 max_output_tokens, and NOT ONE WORD of answer. The
      #                 whole budget went into <think>...</think> and the
      #                 reply never began.
      #   thinking off  9 output tokens, status "completed",
      #                 "Hello, I'm here to help!"
      #
      # Two separate failures, either of which is fatal:
      #
      #   * Latency. Thinking is billed at the same generation rate as the
      #     answer, so a couple of hundred tokens of deliberation is several
      #     seconds of silence BEFORE the reply starts -- on a budget where
      #     the whole spoken turn is supposed to land in ~2 s.
      #   * The answer is spoken. Home Assistant hands the assistant text
      #     straight to piper. With thinking inline, what comes out of the
      #     speaker is the model reasoning about the question, out loud, and
      #     then getting cut off before answering it.
      #
      # Set server-side rather than per-request because Home Assistant's
      # openai_conversation integration has nowhere to put it: it builds its
      # own model_args and sends no chat_template_kwargs. The alternatives
      # are worse -- "/no_think" smuggled into the instructions prompt relies
      # on a soft switch inside the template and burns prompt tokens, and
      # --reasoning-parser only MOVES the thinking into a separate field
      # after paying for every token of it.
      #
      # This applies to every client of this endpoint, which is the intended
      # scope: voice is the anchor workload here. Anything that genuinely
      # wants Qwen3 to think can pass chat_template_kwargs itself, since a
      # per-request value overrides this default.
      thinking: false

      # Tool calling. Grouped because the two are one decision: the parser is
      # meaningless unless calling is on, and turning calling on without a
      # parser is a startup error.
      #
      # WATCHING FOR THE FIX:
      #   https://github.com/vllm-project/vllm/issues/51283
      #   "CPUModelRunner inherits GPU-only StructuredOutputsWorker"
      #   open 2026-08-06, labels bug/cpu. When it closes, flip calling to
      #   true, redeploy, and run the reproducer below. If the engine
      #   survives, the fix landed.
      tool:
        # OFF, and not a preference -- grammar-constrained tool calling
        # crashes vLLM's CPU backend outright:
        #
        #   vllm/v1/worker/gpu/structured_outputs.py:52  apply_grammar_bitmask
        #   RuntimeError: pin_memory=True requires a CUDA or other accelerator
        #                 backend; no pinned memory allocator is available
        #
        # Note the gpu/ in that path: the CPU backend reuses the GPU worker,
        # which hardcodes pin_memory=True. The failure is not a rejected
        # request -- the worker dies, EngineCore dies with it, the API server
        # exits, and every request in flight returns 500 until Kubernetes
        # restarts the pod, which then reloads the model from scratch. To a
        # client it looks like a hang.
        #
        # It fires only when a tool call is actually EMITTED, which is why it
        # reads as intermittent: ordinary chat is fine and the model often
        # declines to call anything. Deterministic reproducer:
        #
        #   tool_choice: {"type":"tool","name":"Bash"}
        #
        # Verified identical on v0.26.0 and v0.27.1, and reported upstream
        # against v0.25.1 -- so downgrading is not an escape. It is a
        # regression of #37705, fixed in March 2026 in a different file that
        # the code has since moved out of.
        #
        # Switching structured-outputs backend does not help either -- the
        # bitmask is applied in vLLM's own worker code, above the backend.
        #
        # With this off the same request fails safely, which is the point --
        # and MEASURED on the H100 on 2026-11-05, where the safe failure is
        # what broke a Diagrid durable agent: every call it made carried tool
        # definitions, so every call came back
        #
        #   HTTP 400  "auto" tool choice requires --enable-auto-tool-choice
        #             and --tool-call-parser to be set
        #
        # ON, because the crash above is CPU-only by construction and the
        # template now gates these flags on vllm.gpu.enabled as well as this
        # toggle. A GPU-less deployment therefore still omits them and still
        # fails safely; this says "tool calling is wanted", not "tool calling
        # is safe everywhere".
        calling: true
        # Model-specific, so it travels with the model above rather than
        # with the server flags -- and it has to match the CHECKPOINT, not
        # the family. This was qwen3_xml, which is wrong for Qwen3-32B-AWQ,
        # and wrong in the silent direction. With tool_choice auto vLLM
        # answered HTTP 200 and put the call in content as plain text:
        #
        #   <tool_call>{"name": "get_weather", ...}</tool_call>
        #
        # with tool_calls null -- so a client sees chatter about calling a
        # tool and no tool call, and nothing anywhere reports an error.
        #
        # A FORCED tool_choice worked even so, because that path is guided
        # decoding and never reaches the parser. Testing only the forced case
        # hides this completely; test tool_choice auto.
        #
        # hermes, because THIS checkpoint's chat_template emits
        # <tool_call>{"name": ..., "arguments": {...}}</tool_call> -- JSON
        # inside the tags -- and contains no <function= or <parameter=, which
        # is what qwen3_xml parses. Read out of the running pod rather than
        # inferred from the model name. Measured 2026-11-05 on an H100.
        #
        # AND IT INVERTS WITH THE CHECKPOINT. Qwen3.5 tells the model to
        # reply in the NESTED form instead, in its own system preamble:
        #
        #   <tool_call>
        #   <function=example_function_name>
        #   <parameter=example_parameter_1>
        #   value_1
        #   </parameter>
        #   </function>
        #   </tool_call>
        #
        # which is qwen3_xml and which hermes cannot read. So this is not a
        # per-family setting: it moves in the SAME EDIT as model.name, in
        # whichever direction that edit goes. Both names are real in the
        # pinned vLLM (vllm/tool_parsers/__init__.py at tag v0.27.1 -- the
        # package moved out of vllm/entrypoints/openai/): hermes ->
        # Hermes2ProToolParser, qwen3_xml -> Qwen3EngineToolParser.
        #
        # Checking costs nothing and needs no pod:
        #   curl -s https://huggingface.co/<repo>/raw/main/chat_template.jinja \
        #     | grep -c '<function='
        # Non-zero means qwen3_xml; only <tool_call> with JSON means hermes.
        parser: hermes

    # GiB for the emptyDir the weights land in. Stated rather than left to
    # the template's `| default 40`, which is what it was before and which
    # hid the real trap: THERE ARE TWO INDEPENDENT 40Gi CEILINGS here. An
    # emptyDir's usage also counts against the pod's ephemeral-storage, so
    # resources.limits.ephemeral-storage below bounds the same bytes from a
    # different direction, the smaller of the two is what actually binds, and
    # overrunning EVICTS the pod mid-download with no other warning.
    #
    # 40 is right for an 18.0 GiB model. Anything larger needs BOTH this and
    # the ephemeral-storage limit raised together -- Qwen3.5-35B-A3B at FP8
    # is 34.9 GiB, which would fit inside 40 with 5 GiB of slack and is
    # exactly the size where this bites quietly. Node disk is not the
    # constraint: the cloud node's storage.size is 150 (GB).
    weightsVolumeGi: 40

    # GiB, and explicit. vLLM defaults this to 4 GiB when unset; on the
    # 7.98 GiB box this replaced, that default plus weights was the most
    # likely way to OOM the node.
    #
    # Not the default, and not a round number -- it is the balancing item in
    # the memory budget above. This model's KV cost is fixed and computable
    # from its config:
    #
    #   2 (K,V) x 28 layers x 8 kv-heads x 128 head-dim x 2 B (bf16)
    #     = 114,688 B = 112 KiB per token
    #
    # so one full 40,960-token sequence needs 4.4 GiB of KV on its own.
    #
    # 8 GiB holds 74,898 tokens. That is far more context than voice will ever
    # use in one request, and buying it is still the right call, because on
    # this backend the KV cache is ALSO the prefix cache. Blocks are evicted
    # LRU, so cache size is directly how many turns of an unchanged system
    # prompt survive between one conversation and the next -- and B-1 measured
    # a warm prefix at 45x a cold one. Room here is bought in prefill seconds,
    # not in batching headroom.
    #
    # It was 6 GiB under the 4B, whose 36 layers cost 144 KiB per token
    # against this model's 112. Dropping to the 1.7B gave back 4.6 GB of
    # weights, which is where the extra 2 GiB of cache comes from.
    kvCacheSpaceGiB: 8

    # Six of eight cores, leaving two for the kubelet and flannel. B-0's sweep
    # is why this costs almost nothing: generation at 4 threads was already
    # 81% of the 8-thread figure because it is memory-bandwidth-bound, so the
    # cores given back come out of prefill, not out of replies.
    threads: 6

  resources:
    requests:
      cpu: "6"
      memory: 8Gi
      # 24Gi, sized for an 18.0 GiB model. This is the number the SCHEDULER
      # uses, so it has to move with the model too -- not just the limits.
      ephemeral-storage: 24Gi
    limits:
      # No CPU limit on purpose: a cgroup quota throttles, and throttling a
      # token generator shows up directly as latency. The request is what
      # reserves the cores; the limit would only add jitter.
      #
      # 16Gi. The budget on a 23.3 GiB node: ~3.2 GiB weights + 8 GiB KV +
      # ~3 GB of vLLM runtime and activations, leaving ~1.8 GiB spare here and
      # ~7 GiB on the node for the kubelet and flannel.
      #
      # It was 18Gi under the 4B. The 1.7B gives back 4.3 GiB of weights and
      # 2 GiB of that went straight back into the KV cache, so the limit only
      # falls by 2 -- deliberately, because a bigger prefix cache is the one
      # purchase that shortens a spoken reply on this backend.
      #
      # VLLM_CPU_KVCACHE_SPACE is added on top of the weights by the CPU
      # backend rather than carved out of a total, so this limit has to cover
      # both or the pod is OOMKilled the moment the cache fills -- which is a
      # failure at steady state under load, not at startup.
      memory: 16Gi
      # 40Gi, and it moves with vllm.weightsVolumeGi above -- see the note
      # there. The emptyDir holding the weights counts against this limit
      # too, so the smaller of the two binds, and exceeding it EVICTS the pod
      # rather than returning an error.
      ephemeral-storage: 40Gi

  # Where this is allowed to run. Both halves are required and they do
  # different jobs: the toleration lets it onto the tainted cloud node, the
  # nodeSelector stops it landing anywhere else. With only the toleration it
  # would be free to schedule onto node1-4, which run etcd.
  # On a GPU session BOTH taints have to be tolerated: cloud nodes carry
  # location=cloud, and a GPU node carries nvidia.com/gpu=present on top of
  # it so that things which merely tolerate the cloud -- this workload's own
  # CPU variant included -- cannot drift onto a machine billed by the
  # GPU-hour. vllm.gpu.enabled adds that toleration and the gpu nodeSelector.
  placement:
    tolerationKey: location
    tolerationValue: cloud
    nodeSelectorKey: node.homelab/location
    nodeSelectorValue: cloud
