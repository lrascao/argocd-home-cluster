# Mongo credentials. Sealed to this cluster's sealed-secrets controller key,
# so the ciphertext is safe in git and the plaintext exists nowhere.
#
# Sealed for name=unifi-mongo AND namespace=unifi specifically -- that pair is
# part of what the controller decrypts against. Renaming either the Secret or
# the namespace means re-sealing, not editing this file; a mismatched pair
# fails to decrypt and the Secret simply never appears, which surfaces as both
# Deployments stuck waiting on a missing secretKeyRef.
#
# To rotate:
#   kubectl create secret generic unifi-mongo --namespace unifi \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=root \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD=... \
#     --from-literal=MONGO_USER=unifi \
#     --from-literal=MONGO_PASS=... \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name sealed-secrets-controller \
#              --controller-namespace kube-system --format yaml
#
# Rotating MONGO_PASS after the first run does NOT change the mongo user --
# the init script only ever runs against an empty data directory. Change it in
# the database too, or the controller stops being able to log in.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: unifi-mongo
  namespace: unifi
spec:
  encryptedData:
    MONGO_INITDB_ROOT_PASSWORD: 
    MONGO_INITDB_ROOT_USERNAME: 
    MONGO_PASS: 
    MONGO_USER: 
  template:
    metadata:
      name: unifi-mongo
      namespace: unifi
