---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-config
  namespace: {{ .Values.namespace }}
spec:
  storageClassName: {{ .Values.controller.persistence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.controller.persistence.size }}
---
# The LAN-facing Service.
#
# type is ClusterIP with externalIPs, not LoadBalancer -- there is no
# LoadBalancer controller in this cluster. kube-proxy (iptables mode) installs
# DNAT rules for an externalIP on every node, for udp as well as tcp, so this
# one address carries the inform port, the web UI and STUN together. Only the
# node currently holding the keepalived VIP ever receives packets for it,
# and every node has the same rules, so a VIP failover needs nothing here.
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: {{ .Values.namespace }}
  labels:
    app: unifi
spec:
  type: ClusterIP
  externalIPs:
    - {{ .Values.externalIP }}
  ports:
    # Device inform. What the AP is pointed at with set-inform, and what it
    # keeps dialling forever afterwards.
    - name: inform
      port: 8080
      protocol: TCP
      targetPort: 8080
    # Web UI, https with the controller's own self-signed certificate.
    - name: gui
      port: 8443
      protocol: TCP
      targetPort: 8443
    # STUN. The reason this is not a NodePort behind haproxy: haproxy is
    # mode tcp, and the NodePort range is 30000-32767 so 3478 could not be
    # allocated there in the first place.
    - name: stun
      port: 3478
      protocol: UDP
      targetPort: 3478
  selector:
    app: unifi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: {{ .Values.namespace }}
  labels:
    app: unifi
spec:
  replicas: 1
  strategy:
    # See the mongo Deployment: ReadWriteOnce claim, so a rolling update
    # deadlocks on the volume.
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      affinity:
        {{- include "local.onPremAffinity" . | nindent 8 }}
      initContainers:
        # Wait for mongo to accept connections from OTHER pods before starting
        # the controller. This is not belt and braces, it is load-bearing.
        #
        # On a first run the mongo entrypoint seeds the database using a
        # temporary mongod bound to 127.0.0.1 only, and rebinds to 0.0.0.0
        # afterwards. For those few seconds the Service has an endpoint that
        # refuses connections from anywhere else.
        #
        # The controller's own startup does a single reachability check and,
        # if it fails, prints "cannot proceed" and stops -- without exiting.
        # The pod stays 0/1 Running rather than entering CrashLoopBackOff, so
        # the kubelet never restarts it and it never recovers on its own. The
        # only cure is deleting the pod by hand, which is a poor thing to
        # discover after a power cut brought both pods up together.
        #
        # A plain tcp connect is exactly the right signal here: it is what
        # distinguishes the localhost-only seeding mongod from the real one,
        # and it involves no credentials. Unbounded on purpose -- a pod held
        # at Init:0/1 says "waiting for its database" far more clearly than
        # one that timed out and gave up.
        #
        # Reuses the mongo image rather than adding a second one to pin: it is
        # already pinned, and already present on the node.
        - name: wait-for-mongo
          image: {{ .Values.mongo.image }}
          command:
            - bash
            - -c
            - |
              until (exec 3<>/dev/tcp/unifi-mongo/27017) 2>/dev/null; do
                echo "waiting for unifi-mongo:27017 to accept connections..."
                sleep 3
              done
              echo "unifi-mongo is reachable"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: unifi
          image: {{ .Values.controller.image }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: MONGO_HOST
              value: unifi-mongo
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: {{ .Values.mongo.dbName | quote }}
            - name: MONGO_AUTHSOURCE
              value: {{ .Values.mongo.authSource | quote }}
            {{- include "local.mongoEnv" . | nindent 12 }}
            - name: MEM_LIMIT
              value: {{ .Values.controller.memLimit | quote }}
            - name: MEM_STARTUP
              value: {{ .Values.controller.memStartup | quote }}
          ports:
            - containerPort: 8080
              name: inform
              protocol: TCP
            - containerPort: 8443
              name: gui
              protocol: TCP
            - containerPort: 3478
              name: stun
              protocol: UDP
          volumeMounts:
            # /config holds the controller's configuration and, once the
            # first-run wizard has switched them on, its automatic backups
            # under /config/data/backup/autobackup -- so the backups live on
            # this claim rather than in the container.
            - name: config
              mountPath: /config
          # A cold Java start on this hardware is minutes, not seconds. The
          # startupProbe buys up to 10 of them before the liveness probe is
          # allowed to have an opinion; without it the controller is killed
          # and restarted forever, which looks like a crash loop and is
          # really just an impatient probe.
          startupProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: unifi-config
