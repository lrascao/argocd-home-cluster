apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mqtt
  name: mqtt
  labels:
    app: mqtt
spec:
  replicas: 1
  # The data volume below is ReadWriteOnce, so a rolling update would deadlock:
  # the new pod cannot attach the volume until the old one has let go of it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      # mosquitto is started as root and drops to the mosquitto user (1883) to
      # run. Without this the freshly provisioned volume is root-owned and the
      # broker cannot write its persistence DB into it.
      securityContext:
        fsGroup: 1883
      containers:
      - name: mqtt
        # Pinned by digest for the same reason as the mqtt-external broker:
        # `:2` has moved to 2.1.2 upstream, so the version that ran was whatever
        # the scheduled node's containerd cache happened to hold. This broker
        # does not trip the 2.1 password-file breakage — it sets
        # allow_anonymous true and defines no password_file — but there is no
        # reason for it to keep drifting either. Its persistence file lives on a
        # PVC rather than a secret mount, so the O_NOFOLLOW change does not
        # reach it.
        image: eclipse-mosquitto:2.0.21@sha256:94f5a3d7deafa59fa3440d227ddad558f59d293c612138de841eec61bfa4d353
        ports:
        - containerPort: 1883
        volumeMounts:
         - name: certs-mqtt
           mountPath: "/mosquitto/certs"
           readOnly: true
         - name: conf-mqtt
           mountPath: "/mosquitto/config"
           readOnly: true
         - name: data-mqtt
           mountPath: "/mosquitto/data"
      volumes:
      - name: certs-mqtt
        secret:
          secretName: certs-mqtt
      - name: conf-mqtt
        configMap:
          name: mqtt
      - name: data-mqtt
        persistentVolumeClaim:
          claimName: mqtt-data
